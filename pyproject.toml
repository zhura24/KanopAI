[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kanopiai"
version = "0.1.0"
description = "PyQt desktop application for canopy detection on geospatial raster imagery."
requires-python = ">=3.13,<3.14"
dependencies = [
    "PyQt6==6.9.1",
    "PyQt6-sip==13.10.2",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "scikit-image==0.25.2",
    "Pillow==11.3.0",
    "rasterio==1.4.3",
    "pyproj==3.6.1",
    "shapely==2.1.1",
    "fiona==1.10.1",
    "geopandas==1.1.1",
    "pyshp==3.0.2.post1",
    "onnxruntime==1.23.1",
    "matplotlib==3.10.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-qt==4.5.0",
    "ruff==0.14.2",
]

[project.scripts]
kanopiai = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "handlers*", "ui*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that exercise integrated UI and workflow paths",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["core", "handlers", "ui", "utils", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
